  MARKDOWN-note:
    type: MARKDOWN
    id: MARKDOWN-note
    children: []
    meta:
      code: '## What kinds of medicine appear in these alerts


        **Not medical advice. Data from CDSCO public alerts.**


        **Read this before the charts: the drug class is not CDSCO data.** The alerts
        name a product, a

        batch and a manufacturer. They do not say what kind of medicine it is - there
        is no therapeutic

        class, no ATC code, and the printed name is all there is to go on. So the
        classes below come from

        a **reviewed vocabulary of 213 ingredient names**, each one accepted by a
        person with its reason

        recorded, applied to the name printed on the pack. They are a lens on the
        archive, not a fact it

        reports.


        **19.4% of findings (1,382) could not be classified at all**, mostly brand-named
        products whose

        pack prints no ingredient. That is the largest single bar below, deliberately:
        a classification

        should be judged first on what it misses.


        **The classes do not add up to 100%, and they are not slices of a pie.** 530
        findings name

        ingredients from two to four different classes - a cough syrup is routinely
        four medicines in one

        bottle - and each is counted under every class it contains. The classes total
        7,721 against an

        archive of 7,126 findings.


        **Not every product here is a medicine.** CDSCO also tests absorbent cotton
        wool, gauze, syringes,

        hand sanitiser, soap and hair colour against Indian Pharmacopoeia standards,
        so four of the classes

        say that rather than pretending otherwise.


        Each finding is still **one tested batch** of one product, not a judgement
        on a product or a

        company, and these remain *reported* failures from a sample that was never
        random - so they

        describe **reporting history, not quality**.


        ---


        **Source:** Central Drugs Standard Control Organization (CDSCO) public drug
        alerts -

        [cdscoonline.gov.in](https://cdscoonline.gov.in/CDSCO/Drugs). Every finding
        links to the document

        that reported it. Data is reproduced for public information, unaltered, and
        is not an official

        record; the CDSCO document is authoritative.


        **How this is built:** CDSCO''s monthly alerts are downloaded, extracted,
        cleaned and checked by an

        automated pipeline, then rebuilt into the tables these charts read. The *Data
        last updated* panel

        shows when that last ran and whether it passed its quality checks.'
