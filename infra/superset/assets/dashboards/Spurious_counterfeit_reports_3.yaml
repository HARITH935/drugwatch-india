  MARKDOWN-note:
    type: MARKDOWN
    id: MARKDOWN-note
    children: []
    meta:
      code: '## Packs CDSCO reported as spurious


        **Not medical advice. Data from CDSCO public alerts.**


        A **spurious** finding means the pack itself was judged fake. This is different
        from a quality

        failure, where a genuine manufacturer''s batch did not meet a standard.


        **The company name printed on a counterfeit pack is the brand that was copied.**
        That company is

        the victim of the counterfeit, not its maker. Nothing on this page identifies
        who produced a fake

        pack, because the alerts do not say - so these findings are **never counted
        against any

        manufacturer**, here or anywhere else in this project.


        **How little this is: 77 findings, from 2024-04 onwards, out of 7,126 in the
        archive.** Spurious

        reporting is recent and sparse - single digits in most months. That makes
        this a record of *what

        CDSCO published about counterfeits*, not a measure of how much counterfeiting
        exists. Please do not

        read the shape of the monthly chart as a trend.


        Each row below keeps its **batch number**, its **alert month** and a **link
        to the CDSCO

        document**, so a specific pack can be checked against the original source.
        "Not found" never means

        "guaranteed safe".


        ---


        **Source:** Central Drugs Standard Control Organization (CDSCO) public drug
        alerts -

        [cdscoonline.gov.in](https://cdscoonline.gov.in/CDSCO/Drugs). Every finding
        links to the document

        that reported it. Data is reproduced for public information, unaltered, and
        is not an official

        record; the CDSCO document is authoritative.


        **How this is built:** CDSCO''s monthly alerts are downloaded, extracted,
        cleaned and checked by an

        automated pipeline, then rebuilt into the tables these charts read. The *Data
        last updated* panel

        shows when that last ran and whether it passed its quality checks.'
