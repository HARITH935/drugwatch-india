  MARKDOWN-note:
    type: MARKDOWN
    id: MARKDOWN-note
    children: []
    meta:
      code: '## Medicine quality reports from CDSCO alerts


        **Not medical advice. Data from CDSCO public alerts.**


        Each finding applies to **one specific batch** that a laboratory tested, not
        to the product or the

        company as a whole. These are *reported* failures from a sample that was never
        random, so they

        describe **reporting history, not quality**.


        **Read the two charts below together.** The number of findings per month has
        risen, but so has the

        number of laboratories reporting them - across years the two track each other
        almost exactly

        (r = 0.964). What grew fastest is testing, not failure.


        **A ranking is not a list of the worst companies.** 58% of the 2,609 manufacturers
        in this archive

        appear exactly once. The table is ordered by how many *separate alert months*
        named a company,

        because a pattern that persists across months means more than a single inspection
        sweep.


        "Not found" never means "guaranteed safe": a batch can be absent because nobody
        sampled it, or

        because CDSCO published no alert that month (101 of 111 months are covered).


        ---


        **Source:** Central Drugs Standard Control Organization (CDSCO) public drug
        alerts -

        [cdscoonline.gov.in](https://cdscoonline.gov.in/CDSCO/Drugs). Every finding
        links to the document

        that reported it. Data is reproduced for public information, unaltered, and
        is not an official

        record; the CDSCO document is authoritative.


        **How this is built:** CDSCO''s monthly alerts are downloaded, extracted,
        cleaned and checked by an

        automated pipeline, then rebuilt into the tables these charts read. The *Data
        last updated* panel

        shows when that last ran and whether it passed its quality checks.'
      width: 12
      height: 60
