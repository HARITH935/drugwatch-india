  MARKDOWN-note:
    type: MARKDOWN
    id: MARKDOWN-note
    children: []
    meta:
      code: "## Two different questions about states\n\n**Not medical advice. Data\
        \ from CDSCO public alerts.**\n\nA finding has two states attached, and they\
        \ are **not the same thing**:\n\n- **Made here** - the state the manufacturer\
        \ is in. This says something about where a flagged batch\n  came from.\n-\
        \ **Tested here** - the state of the laboratory that tested it. This says\
        \ where the *laboratories*\n  are. CDSCO's central laboratories draw samples\
        \ from the whole country.\n\n**In 92.7% of findings where both are known,\
        \ they are different states.** West Bengal tests\n1,758 findings and makes\
        \ 103; Himachal Pradesh makes 2,147 and tests 104.\n\nSo the two charts below\
        \ are kept apart, and **their numbers must never be added together** - that\n\
        would double-count the few findings where maker and laboratory share a state,\
        \ and misrepresent\nevery other one. If you want \"what did this state's own\
        \ laboratories find?\", use the\n*tested by a state laboratory* column in\
        \ the table, which is much smaller than the headline.\n\nThere is **no map**\
        \ here. India's boundaries are legally sensitive to depict, and a bar chart\n\
        carries the same information without making a territorial claim. 603 of 2,609\
        \ manufacturers have no\nresolvable state at all, so they appear in no bar\
        \ on this page.\n\n---\n\n**Source:** Central Drugs Standard Control Organization\
        \ (CDSCO) public drug alerts -\n[cdscoonline.gov.in](https://cdscoonline.gov.in/CDSCO/Drugs).\
        \ Every finding links to the document\nthat reported it. Data is reproduced\
        \ for public information, unaltered, and is not an official\nrecord; the CDSCO\
        \ document is authoritative.\n\n**How this is built:** CDSCO's monthly alerts\
        \ are downloaded, extracted, cleaned and checked by an\nautomated pipeline,\
        \ then rebuilt into the tables these charts read. The *Data last updated*\
        \ panel\nshows when that last ran and whether it passed its quality checks."
