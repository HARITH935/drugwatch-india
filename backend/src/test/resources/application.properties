# Test-only configuration. A fixed signing secret so tokens are reproducible across a run, and a
# known site URL so the links in emails can be asserted on. Neither is used outside tests.
drugwatch.auth.jwt-secret=test-only-signing-secret-at-least-32-bytes-long
drugwatch.site-url=http://localhost:3000
drugwatch.mail.from=alerts@drugwatch.test
