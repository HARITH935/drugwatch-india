# ArchUnit fails a rule that matched no classes, on the grounds that a rule checking nothing is
# usually a rule whose naming convention has drifted. That is the right default and it is relaxed
# here for one reason: step 0 is the skeleton, so there are no controllers or repositories yet and
# every layering rule would fail on an empty match.
#
# The allowance is made safe by `ArchitectureTest.the_api_has_controllers_to_check` (added in
# step 2), which asserts the rules have something to bite on. Without it, renaming every
# controller would silently switch the layering checks off.
archRule.failOnEmptyShould=false
