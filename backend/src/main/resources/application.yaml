# Configuration for local development. Production values come from the environment (plan §15):
# nothing secret may live in this file, and nothing here may default to a working secret.
spring:
  application:
    name: drugwatch-api

  datasource:
    # Host 5433 is how Postgres is published to this Mac; inside Docker it is postgres:5432.
    # Production (Phase 12) sets API_DB_URL to a complete JDBC URL instead, because Neon needs
    # `?sslmode=require` and its own host - which host/port/database alone cannot express.
    url: ${API_DB_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:drugwatch}}
    username: ${API_DB_USER:drugwatch_api}
    # No default, on purpose: the application must refuse to start rather than fall back to a
    # guessable password (plan §15, and the same rule as every other service here).
    password: ${API_DB_PASSWORD}

  jpa:
    hibernate:
      # Never `update` or `create`. Flyway owns the `app` schema and dbt owns `gold`; Hibernate
      # generating tables at startup would give the schema no history, no review and no rollback.
      # `validate` instead makes a mismatch between an entity and its table fail at boot, loudly,
      # rather than at the first query that touches the missing column.
      ddl-auto: validate
    properties:
      hibernate:
        # The API's own tables live in `app`, so an unqualified entity resolves there rather than
        # in `public` - which this role deliberately cannot use at all.
        default_schema: app
    open-in-view: false # see the note below

  data:
    redis:
      # Production (Phase 12) sets the environment variable SPRING_DATA_REDIS_URL to Upstash's
      # `rediss://default:<password>@host:port`, which Spring's relaxed binding maps onto
      # `spring.data.redis.url` and prefers over the host/port below. One URL rather than more
      # settings, because host and port alone cannot say "use TLS" or carry a password, and
      # Upstash requires both.
      #
      # Deliberately NOT declared here as `url: ${REDIS_URL:...}`. There is no way to write "unset"
      # as a placeholder default: an empty string is an invalid URL, and `${REDIS_URL:#{null}}`
      # is not evaluated as SpEL on this binding path - it reached Lettuce as the literal string
      # and failed every test with `Invalid Redis URL '#{null}'`. Leaving the key out entirely is
      # what actually leaves it unset.
      host: ${REDIS_HOST:localhost}
      # Host 6380, because OpsPilot's Redis already uses 6379 (CLAUDE.md §10). Inside Docker it
      # is redis:6379.
      port: ${REDIS_PORT:6380}

  mail:
    # Mailpit locally; Brevo in production (plan §8). Both are reached the same way, so only
    # these values change between them.
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

  flyway:
    enabled: true
    schemas: app
    # Flyway creates its history table in the first schema it manages, and must not try to create
    # the schema itself: `app` is created by infra/postgres/api_role.sql so that the role owns it.
    create-schemas: false

server:
  port: ${PORT:8080}
  # Production (Phase 12) sets this to `framework`. Render terminates TLS at its edge and speaks
  # plain HTTP to the container, so without it the API believes every request is http:// - which
  # makes the links it builds (an email verification link, a redirect) point at http, and marks
  # session cookies as not-secure. `none` locally, where there is no proxy and trusting a
  # client-supplied X-Forwarded-For would let anyone spoof their own rate-limit identity.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  # Do not tell the internet which server this is; it is free information for an attacker.
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        # Health only. Actuator can publish configuration, environment variables and heap dumps,
        # and this service is the one Phase 12 exposes - so the set is named rather than defaulted.
        include: health
  health:
    mail:
      # Off, and not only because a mocked sender breaks it in tests. Actuator's mail check opens
      # an SMTP connection on every health poll, and a failing one turns the whole service DOWN -
      # so an outage at the mail provider would make Docker restart a perfectly working API, and
      # take the public batch checker down with it. Mail failures are logged where they happen.
      enabled: false
  endpoint:
    health:
      # "UP" and nothing else by default. Component detail names internal services (database,
      # Redis, the risk API) and their state, which is operational detail, not public information.
      show-details: never
      show-components: never

drugwatch:
  auth:
    # No default. A signing secret that falls back to a known value means anybody can mint a token
    # for any account - so the application refuses to start without one (plan §15).
    # Generate: openssl rand -hex 32
    jwt-secret: ${JWT_SECRET}
  mail:
    from: ${SMTP_FROM:alerts@drugwatch.local}
  rate-limit:
    # Requests per minute per caller, on the public lookups. 60 is generous for a person using
    # the site and cheap to exceed for a script, which is the distinction worth drawing.
    per-minute: ${RATE_LIMIT_PER_MINUTE:60}
  superset:
    # Inside Docker it is superset:8088; from this Mac, the published port.
    base-url: ${SUPERSET_URL:http://localhost:8088}
    # The service account that may only mint guest tokens - one permission, nothing else
    # (infra/superset/configure_embedding.py). No password default: the API must refuse to start
    # rather than try a guessable one.
    username: ${SUPERSET_EMBED_USERNAME:embed_service}
    password: ${SUPERSET_EMBED_PASSWORD}
    # The allowlist: public key -> Superset's embedded UUID. A dashboard not listed here cannot be
    # embedded, so one added later is private until somebody lists it on purpose. The UUIDs come
    # from configure_embedding.py.
    dashboards:
      manufacturer-reporting: ${SUPERSET_DASHBOARD_MANUFACTURER:}
      states: ${SUPERSET_DASHBOARD_STATES:}
      drug-classes: ${SUPERSET_DASHBOARD_DRUG_CLASSES:}
      spurious-reports: ${SUPERSET_DASHBOARD_SPURIOUS:}
  risk:
    # The Phase 8 service. Inside Docker it is risk-api:8000; from this Mac, the published port.
    base-url: ${RISK_API_URL:http://localhost:8000}
    # The shared bearer token the risk service checks on every route (Phase 12 step 2). Empty
    # locally, where docker-compose sets none and the service asks for none. In production a wrong
    # value is logged as a credentials refusal, not as "no score today" - see RiskClient.
    token: ${RISK_API_TOKEN:}
  # Where the links in emails point. Not a secret, but wrong by default is worse than absent:
  # a verification link to the wrong host is a link that cannot be used.
  site-url: ${SITE_URL:http://localhost:3100}

# OpenAPI (springdoc). The document itself is generated from the controllers; these are the only
# choices worth making about it.
springdoc:
  api-docs:
    version: openapi_3_1 # the current spec; springdoc still defaults to 3.0 for older clients
  swagger-ui:
    # Endpoints grouped by tag, and the tags and operations in the order the code declares them -
    # which puts the batch checker first, where it belongs. Alphabetical would bury it under
    # "Accounts".
    tags-sorter: alpha
    operations-sorter: method
    # Nothing is pre-expanded: the page opens as a readable list of endpoints rather than a wall
    # of schemas.
    doc-expansion: none
    # Swagger's own "Try it out" sends requests to this API, which is the point of the page.
    try-it-out-enabled: true
  show-actuator: false # springdoc's default, set explicitly: /actuator/health is not public API

logging:
  level:
    root: INFO

# open-in-view is disabled above. Left on (its default), Spring keeps a database connection open
# for the whole HTTP request so that lazy associations still work while the response is being
# written. That turns a slow JSON serialisation into a held connection, and hides N+1 queries
# behind a controller instead of failing in the service where they can be fixed.
