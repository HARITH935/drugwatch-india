# Local development services for DrugWatch India.
#   Start: docker compose up -d        Stop: docker compose down
#   Status: docker compose ps          Logs: docker compose logs -f <service>
# ${VARS} are read from the .env file in this folder (template: .env.example).
# ${VAR:?msg} means "refuse to start if VAR is missing", so no service ever runs with a default password.
# Production config lives separately in infra/ (Phase 12).

name: drugwatch # prefix for container, network and volume names (keeps them apart from OpsPilot)

services:
  # --- PostgreSQL: gold layer (dbt marts) + app tables ---
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drugwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-drugwatch}
    ports:
      # host:container. Host 5433 because OpsPilot's Postgres already uses 5432.
      # 127.0.0.1 = reachable only from this Mac, not from other devices on your Wi-Fi.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data # named volume: data survives container restarts/recreation
    healthcheck:
      # $$ passes a literal $ so the container's shell (not Compose) fills in the variable
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- RustFS: S3-compatible storage for raw/ bronze/ silver/ (replaces MinIO, see ADR 0002) ---
  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env} # S3 "username"
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env} # S3 "password"
      RUSTFS_CONSOLE_ENABLE: "true" # turn on the web console (port 9001)
    ports:
      - "127.0.0.1:9000:9000" # S3 API: what our code talks to
      - "127.0.0.1:9001:9001" # web console: http://localhost:9001/rustfs/console/ (the bare root URL returns 403)
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- rustfs-init: one-shot setup job. Creates the raw/bronze/silver buckets, then exits. ---
  # Run it yourself:  docker compose run --rm rustfs-init
  # It's idempotent (existing buckets are left alone), so it's safe to re-run. Buckets live in the
  # rustfs-data volume, so you only need to re-run it after `docker compose down -v`.
  rustfs-init:
    # The "setup" profile keeps this job out of `docker compose up`. Otherwise `up --wait` reports a
    # failure whenever this job has already finished, even successfully (exit 0).
    profiles: ["setup"]
    image: rustfs/rustfs:1.0.4 # reuse the RustFS image: it already contains curl
    depends_on:
      rustfs:
        condition: service_healthy # start only once the S3 API is answering
    entrypoint: ["sh", "/scripts/create-buckets.sh"] # run our script instead of the RustFS server
    environment:
      S3_ENDPOINT: http://rustfs:9000 # inside the compose network, the service name works as a hostname
      BUCKETS: raw bronze silver # gold lives in Postgres, not here
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
    volumes:
      - ./infra/rustfs/create-buckets.sh:/scripts/create-buckets.sh:ro # :ro = read-only inside the container

  # --- Redis: cache for batch lookups (used by Spring Boot in Phase 9) ---
  redis:
    image: redis:8.8
    # No password: dev only and bound to localhost. Production Redis is never exposed (plan §15).
    ports:
      - "127.0.0.1:6380:6379" # host 6380 because OpsPilot's Redis already uses 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Mailpit: fake SMTP server + web inbox; catches every email in dev ---
  mailpit:
    image: axllent/mailpit:v1.33 # has its own built-in health check
    environment:
      # Accept any login, so apps use the same SMTP settings (host, port, user, password) as Brevo in production
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true" # allow that login without TLS (fine on localhost only)
    ports:
      - "127.0.0.1:1025:1025" # SMTP: apps send mail here
      - "127.0.0.1:8025:8025" # web inbox: http://localhost:8025

  # --- Superset: the dashboards (Phase 6). Reads the gold layer as `superset_reader`. ---
  # In Docker, unlike Airflow (ADR 0012): it is a plain web app with no Spark beside it, and it is
  # the one service Phase 12 exposes to the internet, so it belongs in the same compose file as the
  # database it reads.
  superset:
    # Built from infra/superset/Dockerfile: the official image ships no Postgres driver at all.
    build:
      context: .
      dockerfile: infra/superset/Dockerfile
    image: drugwatch/superset:6.1.0 # the built image, shared by both services below
    depends_on:
      postgres:
        condition: service_healthy # Superset's metadata lives in Postgres; starting first is a crash
      redis:
        condition: service_started
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?Set SUPERSET_SECRET_KEY in .env}
      POSTGRES_USER: ${POSTGRES_USER:-drugwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py # where it looks for the mounted config
    volumes:
      # Read-only: the container has no business editing its own configuration.
      - ./infra/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    ports:
      - "127.0.0.1:8088:8088" # reachable only from this Mac, like every other service here
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s # first boot loads a lot of Python before it answers anything

  # --- superset-init: one-shot setup job. Migrates Superset's metadata and creates the admin. ---
  # Run it yourself:  docker compose run --rm superset-init
  # Idempotent, like rustfs-init: `db upgrade` is a no-op when already current, and the admin is
  # only created if missing. Re-run after `docker compose down -v`, or to reset the admin password.
  superset-init:
    # Built from infra/superset/Dockerfile: the official image ships no Postgres driver at all.
    build:
      context: .
      dockerfile: infra/superset/Dockerfile
    image: drugwatch/superset:6.1.0 # the built image, shared by both services below
    profiles: ["init"] # kept out of `docker compose up`: a one-shot job is not a service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?Set SUPERSET_SECRET_KEY in .env}
      POSTGRES_USER: ${POSTGRES_USER:-drugwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?Set SUPERSET_ADMIN_PASSWORD in .env}
    volumes:
      - ./infra/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    entrypoint: ["/bin/bash", "-c"]
    # $$ is an escaped $ for Compose, so the container's shell expands these, not Compose.
    command:
      - |
        set -e
        superset db upgrade
        superset fab create-admin --username "$${ADMIN_USERNAME}" --firstname Admin --lastname User --email admin@drugwatch.local --password "$${ADMIN_PASSWORD}" || echo "admin already exists"
        superset init

volumes:
  postgres-data:
  rustfs-data:
