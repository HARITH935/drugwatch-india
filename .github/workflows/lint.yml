# CI lint workflow: runs on every push to main and on every pull request.
# repo-checks: repo hygiene (Phase 0). python: lint + tests for each Python folder (Phase 1, ADR 0005).
# backend: the Spring Boot API (Phase 9, ADR 0018). frontend: the Next.js site (Phase 11, ADR 0020).
name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # least privilege: this workflow only needs to read the code

jobs:
  repo-checks:
    runs-on: ubuntu-latest # fresh GitHub-hosted Linux VM; Docker + Compose are preinstalled
    timeout-minutes: 5 # kill the job if it hangs, so it can't burn minutes
    steps:
      - uses: actions/checkout@v7 # download this repo onto the runner

      - name: Repo hygiene checks
        run: bash .github/scripts/repo-checks.sh

      # infra/ holds Python that no uv project owns (Superset provisioning, ADR 0013-era scripts),
      # so the per-project matrix below never sees it. uvx runs a pinned ruff without installing
      # a project: without this step these files were linted by hand, which is to say not at all.
      - name: Lint the infra/ scripts
        run: |
          curl -LsSf https://astral.sh/uv/0.13.6/install.sh | sh
          ~/.local/bin/uvx ruff@0.17.4 check infra/
          ~/.local/bin/uvx ruff@0.17.4 format --check infra/

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # spark/: installing PySpark (450 MB) is slow until uv's cache is warm
    strategy:
      matrix:
        project: [ingestion, extraction, spark, quality, warehouse, orchestration, analytics, ml, ml-serving, llm]
    defaults:
      run:
        working-directory: ${{ matrix.project }} # every `run:` step below starts in this folder
    steps:
      - uses: actions/checkout@v7

      # spark/ only: PySpark 4.x needs Java 17+ (ADR 0008). The runner's own default JDK isn't
      # guaranteed to be 17, so this installs one explicitly rather than relying on it.
      - if: matrix.project == 'spark'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      # Pinned to a full commit SHA (this action publishes no floating v10 tag); a SHA can't be re-pointed.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6" # same uv as local dev, so lockfile handling matches
          working-directory: ${{ matrix.project }} # where it looks for pyproject.toml / uv.lock (cache key)

      - name: Install dependencies (exactly as locked)
        run: uv sync --locked # fails if uv.lock is out of date with pyproject.toml

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check . # fails (doesn't fix) if any file isn't formatted

      - name: Tests
        run: uv run pytest

  # dbt has no pytest suite: its check is that the project parses - every model's SQL and every
  # YAML file - which needs no database. `dbt build` itself needs Postgres and the loaded silver,
  # so it stays a local/Phase 5 step.
  dbt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dbt
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          working-directory: dbt

      - name: Install dependencies (exactly as locked)
        run: uv sync --locked

      # Checked 2026-11-18: `dbt parse` needs no credentials and opens no connection, so CI
      # sets nothing. If a future change makes it need one, it fails here rather than silently
      # connecting to something.
      - name: Parse the dbt project
        run: uv run dbt parse

  # The Spring Boot API (Phase 9, ADR 0018). Separate from the python job rather than another
  # matrix entry: it needs a JDK and a Maven cache instead of uv, and it runs in parallel so a
  # slower Java build does not delay the Python feedback.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21" # Spring Boot 4 needs 17+; 21 is the current LTS and what local dev uses
          cache: maven # caches ~/.m2 keyed on pom.xml, so a clean build is not a full re-download

      # ./mvnw, not mvn: the wrapper pins Maven 3.10.0, so CI and this Mac run the same build
      # tool. The same reasoning as uv.lock for Python and --frozen for the serving image.
      - name: Build, test and check formatting
        run: ./mvnw -B verify


  # The Next.js site (Phase 11, ADR 0020). Every check that runs on the Mac runs here, in the
  # same order, including the end-to-end tests: Playwright runs the production build against
  # e2e/stub-backend.mjs, because this runner has no Spring, Postgres or Redis.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22" # the major the Mac runs; jsdom 29 needs 22.13+, any current 22.x has it
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci`, not `npm install`: installs exactly package-lock.json and fails if it is out of
      # date - the equivalent of `uv sync --locked`.
      - name: Install dependencies (exactly as locked)
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # No backend here, and none needed: the page's data is fetched per request, never at build
      # time (ADR 0020), so a build that needed Spring would be a bug this step catches.
      - name: Production build
        run: npm run build

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (desktop and phone sizes)
        run: npm run e2e


  # --- Phase 12 step 4: publish the API's image, because Render cannot build it ---
  #
  # Maven Central answers Render's build servers with HTTP 429, so compiling there is not possible
  # at all - not a Dockerfile problem, and no retry fixes it. GitHub's runners are not throttled
  # (every `backend` run above proves it), so the image is built here and Render only runs it.
  #
  # `needs: backend` is the gate ADR 0021 asks for: no image can be published, and so no deploy
  # can happen, unless the full suite passed first. Pull requests build nothing - only a push to
  # main publishes - so a fork cannot push an image into the registry.
  publish-api-image:
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # the only job here that writes anything outside the run
    steps:
      - uses: actions/checkout@v7

      # GHCR wants an all-lowercase owner, and this repo's is not.
      - name: Work out the image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/drugwatch-api" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # scoped to this run, no stored secret needed

      # Context is the repo root, which is what backend/Dockerfile expects and what Render gives
      # it too - so this builds the same way in both places.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          # Both tags on purpose: :latest is what Render follows, and the commit SHA makes it
          # possible to say which commit a running container actually came from, and to roll back.
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
