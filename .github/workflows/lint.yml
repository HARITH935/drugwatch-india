# CI lint workflow: runs on every push to main and on every pull request.
# repo-checks: repo hygiene (Phase 0). python: lint + tests for each Python folder (Phase 1, ADR 0005).
# backend: the Spring Boot API (Phase 9, ADR 0018). Still to come: TypeScript → Phase 11.
name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # least privilege: this workflow only needs to read the code

jobs:
  repo-checks:
    runs-on: ubuntu-latest # fresh GitHub-hosted Linux VM; Docker + Compose are preinstalled
    timeout-minutes: 5 # kill the job if it hangs, so it can't burn minutes
    steps:
      - uses: actions/checkout@v7 # download this repo onto the runner

      - name: Repo hygiene checks
        run: bash .github/scripts/repo-checks.sh

      # infra/ holds Python that no uv project owns (Superset provisioning, ADR 0013-era scripts),
      # so the per-project matrix below never sees it. uvx runs a pinned ruff without installing
      # a project: without this step these files were linted by hand, which is to say not at all.
      - name: Lint the infra/ scripts
        run: |
          curl -LsSf https://astral.sh/uv/0.13.6/install.sh | sh
          ~/.local/bin/uvx ruff@0.17.4 check infra/
          ~/.local/bin/uvx ruff@0.17.4 format --check infra/

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # spark/: installing PySpark (450 MB) is slow until uv's cache is warm
    strategy:
      matrix:
        project: [ingestion, extraction, spark, quality, warehouse, orchestration, analytics, ml, ml-serving]
    defaults:
      run:
        working-directory: ${{ matrix.project }} # every `run:` step below starts in this folder
    steps:
      - uses: actions/checkout@v7

      # spark/ only: PySpark 4.x needs Java 17+ (ADR 0008). The runner's own default JDK isn't
      # guaranteed to be 17, so this installs one explicitly rather than relying on it.
      - if: matrix.project == 'spark'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      # Pinned to a full commit SHA (this action publishes no floating v10 tag); a SHA can't be re-pointed.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6" # same uv as local dev, so lockfile handling matches
          working-directory: ${{ matrix.project }} # where it looks for pyproject.toml / uv.lock (cache key)

      - name: Install dependencies (exactly as locked)
        run: uv sync --locked # fails if uv.lock is out of date with pyproject.toml

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check . # fails (doesn't fix) if any file isn't formatted

      - name: Tests
        run: uv run pytest

  # dbt has no pytest suite: its check is that the project parses - every model's SQL and every
  # YAML file - which needs no database. `dbt build` itself needs Postgres and the loaded silver,
  # so it stays a local/Phase 5 step.
  dbt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dbt
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          working-directory: dbt

      - name: Install dependencies (exactly as locked)
        run: uv sync --locked

      # Checked 2026-11-18: `dbt parse` needs no credentials and opens no connection, so CI
      # sets nothing. If a future change makes it need one, it fails here rather than silently
      # connecting to something.
      - name: Parse the dbt project
        run: uv run dbt parse

  # The Spring Boot API (Phase 9, ADR 0018). Separate from the python job rather than another
  # matrix entry: it needs a JDK and a Maven cache instead of uv, and it runs in parallel so a
  # slower Java build does not delay the Python feedback.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21" # Spring Boot 4 needs 17+; 21 is the current LTS and what local dev uses
          cache: maven # caches ~/.m2 keyed on pom.xml, so a clean build is not a full re-download

      # ./mvnw, not mvn: the wrapper pins Maven 3.10.0, so CI and this Mac run the same build
      # tool. The same reasoning as uv.lock for Python and --frozen for the serving image.
      - name: Build, test and check formatting
        run: ./mvnw -B verify

