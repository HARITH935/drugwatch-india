version: 2

models:
  - name: fact_nsq_sample
    description: >
      One row per CDSCO finding (ADR 0010), keyed on `sample_id` and pointing at dim_drug,
      dim_manufacturer and dim_date. A spurious report carries no `manufacturer_id` on purpose:
      the name on a counterfeit pack is the copied brand, kept in `name_on_pack`.
      Every row keeps the source document, page and URL.
    columns:
      - name: sample_id
        data_tests:
          - unique
          - not_null
        description: "Primary key, carried through from staging. Traces back to source file + page + row."
      - name: manufacturer_id
        data_tests:
          - relationships:
              arguments:
                to: "ref('dim_manufacturer')"
                field: "manufacturer_id"
        description: "FK to dim_manufacturer. Null for spurious reports and where no maker was printed."
      - name: drug_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: "ref('dim_drug')"
                field: "drug_id"
        description: "FK to dim_drug (the product name as printed)."
      - name: alert_date_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: "ref('dim_date')"
                field: "date_id"
        description: "FK to dim_date: the first day of the CDSCO alert month."
      - name: is_spurious
        data_tests:
          - not_null
        description: "True = reported as spurious/counterfeit, not as a quality failure by its maker."
      - name: source_url
        data_tests:
          - not_null
        description: "The original CDSCO document. Required on every public view of a finding."
      - name: lab_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["Central", "State"]
        description: >
          Central (CDSCO's own CDL/CDTL/RDTL, which test samples drawn nationwide) or State (a
          state laboratory, testing its own state's samples). Null where the reporter named no
          laboratory at all (424 rows). The two are not comparable and must never be summed as
          "reports per state".
      - name: reported_state_id
        data_tests:
          - relationships:
              arguments:
                to: "ref('dim_state')"
                field: "state_id"
        description: >
          FK to dim_state: the REPORTING LABORATORY's state, never the manufacturer's. 498
          findings tested in West Bengal were made in Himachal Pradesh. For the manufacturing
          state use dim_manufacturer.state_name.
      - name: reported_state_source
        data_tests:
          - accepted_values:
              arguments:
                values: ["reporter_names_the_state", "lab_city"]
        description: "reporter_names_the_state (2,264) | lab_city (4,671) | null (191)."

  - name: dim_manufacturer
    description: >
      One row per manufacturer after Phase 3's entity resolution (2,609 companies from 3,302
      cleaned spellings), plus the state read out of the address. Holds no counts: dimensions
      describe, marts count. `city` (plan §8.1) is still absent - a city has no closed vocabulary
      to check against the way the states do.
    columns:
      - name: manufacturer_id
        data_tests:
          - unique
          - not_null
        description: "md5 of the canonical name."
      - name: name_variants
        description: "Every cleaned spelling that resolved to this company; 484 have more than one."
      - name: state_name
        description: >
          The manufacturing state, from two signals: the address naming it (a reviewed vocabulary
          of 62 spellings), else a PIN prefix mapped by a table learned from the addresses that do
          name their state. 76.9% of companies are resolved. Null means "not stated, and not
          guessed" - never "no state".
      - name: state_name_source
        data_tests:
          - accepted_values:
              arguments:
                values: ["address_names_the_state", "learned_pin_prefix"]
        description: >
          address_names_the_state (1,726) | learned_pin_prefix (280) | null. A PIN-derived state
          agrees with a named one 99.78% of the time on held-out rows (analyses/pin_prefix_holdout.sql).
      - name: state_id
        data_tests:
          - relationships:
              arguments:
                to: "ref('dim_state')"
                field: "state_id"
        description: "FK to dim_state. Null wherever state_name is."
      - name: name_match_status
        data_tests:
          - accepted_values:
              arguments:
                values: ["matched", "no_state_in_address", "no_address", "conflicting_states"]
        description: "matched | no_state_in_address | no_address | conflicting_states."
      - name: pin_code
        description: "The postal code read off the address, if it prints one that is not a plot number."
      - name: state_match_evidence
        description: "Which alias produced the answer, so any row can be audited back to the words."
      - name: latest_address
        description: "The address as printed on the most recent alert, still unparsed."

  - name: dim_state
    description: >
      One row per Indian state and union territory, built from the vocabulary seed rather than
      from observed values, so a state with no findings still has a row and a map shows "0" rather
      than a gap.
    columns:
      - name: state_id
        data_tests:
          - unique
          - not_null
        description: "md5 of the state name - the same formula dim_manufacturer uses."
      - name: state_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["State", "Union Territory"]
        description: "State or Union Territory."
      - name: alias_count
        description: "How many spellings of this state the vocabulary recognises."

  - name: dim_drug
    description: >
      One row per product name as CDSCO printed it (5,651). Verified: a product name never carries
      two different dosage forms, generic/brand names or strength lists. Differently-printed names
      for the same medicine are NOT merged - that needs the same reviewed evidence Phase 3 used
      for manufacturers. `drug_class` from plan §8.1 is absent: no classification source exists yet.
    columns:
      - name: drug_id
        data_tests:
          - unique
          - not_null
        description: "md5 of the product name."
      - name: generic_name
        description: "Filled only where the split was unambiguous (~20%); null means 'not stated', not 'none'."

  - name: dim_date
    description: >
      One row per calendar day, spanning whole years from the earliest to the latest date in the
      fact (alert months, manufacture and expiry dates). Range derived from the data, not hardcoded.
    columns:
      - name: date_id
        data_tests:
          - unique
          - not_null
        description: "YYYYMMDD as an integer: the classic star-schema date key."
      - name: year_month
        description: "'YYYY-MM', the same spelling the fact's `alert_month` uses."

  - name: mart_manufacturer_trend
    description: >
      Reports per manufacturer per month, with rolling 6- and 12-month counts, over a dense month
      grid so quiet months count as zero. Neutral by construction: every column counts reports,
      which is reporting history, never a judgement about a company.
    columns:
      - name: reports_rolling_6m
        description: >
          A RANGE window over dates, not a ROWS window over rows: CDSCO published in 101 of the
          111 months the archive spans, so "the previous 5 rows" is not "the previous 5 months".
      - name: months_since_previous_report
        description: "Null in a month with no report; otherwise the gap back to the previous one."

  - name: mart_repeat_reported_manufacturers
    description: >
      Manufacturers reported in 3 or more separate CDSCO alert months (500 of 2,609). Plan §8.2
      calls this mart `mart_repeat_offenders`; renamed, because "offender" is a verdict and
      CLAUDE.md §6 forbids it - what this holds is a count of alert months. Alert months, not
      reports: ten findings in one alert is one inspection sweep, one finding in each of ten
      months is a pattern.
    columns:
      - name: alert_months_reported
        description: "How many separate CDSCO alert months named this company."
      - name: rank_by_alert_months
        description: >
          DENSE_RANK, so tied companies share a rank and no rank is skipped - a public list must
          not imply an order the data does not support.
      - name: longest_gap_months
        description: "The longest quiet stretch between two consecutive alert months."

  - name: mart_state_summary
    description: >
      Reports per state counted two ways that must never be confused, side by side, with every
      state and UT present (dim_state is the spine) so a map shows 0 rather than a gap.
    columns:
      - name: reports_made_here
        description: "Findings whose MANUFACTURER is in this state."
      - name: reports_tested_here
        description: >
          Findings whose REPORTING LABORATORY is in this state. Not a measure of local drug
          quality: central labs test nationwide, so 498 findings tested in West Bengal were made
          in Himachal Pradesh.
      - name: state_lab_reports_tested_here
        description: "The honest subset for a 'tested in this state' question: state labs only."

  - name: mart_ml_features
    description: >
      Phase 7's feature table: one row per manufacturer per monthly cutoff (85,924), features
      computed only from months up to and including `as_of_month`, label from the 6 months after
      it. Verified against an independent recomputation of every row: 0 wrong features, 0 wrong
      labels, 0 leaked labels. Known limitation that must travel with any score built on it:
      these are reported failures from a non-random sample - reporting history, not true quality.
    columns:
      - name: as_of_month
        data_tests:
          - not_null
        description: "The cutoff. Every feature uses only data up to and including this month."
      - name: label_reported_next_6m
        description: >
          Plan §12's label: reported at least once in the following 6 months. Null where the
          archive cannot answer yet (the last 6 cutoffs); `label_window_complete` says which.
          71,354 rows are complete, 14.2% of them positive.
      - name: central_lab_share_12m
        description: "Null, not 0, when there were no reports to divide - absence is not 0%."
      - name: assay_share_12m
        description: >
          Share of category MENTIONS, not of reports: 22.6% of findings name more than one failed
          test (ADR 0009), so these shares do not sum to 1.

  - name: mart_monthly_reporting
    description: >
      Findings per published alert month, with the number of reporting laboratories beside them.
      The two series share one mart on purpose: the exploration found findings and lab counts
      correlate at r = 0.964 across years, so a findings-only chart would read as falling quality.
      Months CDSCO never published are absent, not zero - 101 of 111 calendar months spanned.
    columns:
      - name: alert_month
        data_tests: [unique, not_null]
      - name: reporting_labs
        description: >
          Distinct `reported_by` values that month. The honesty column: findings rise with this.
      - name: findings
        description: "Findings published in that alert month. Not a measure of drug quality."

  - name: mart_manufacturer_report_counts
    description: >
      The archive's shape: how many companies have how many findings. 58% appear exactly once and
      the median company has one finding, so this is what belongs beside any top-N ranking - it
      shows how unrepresentative the top of such a list is. Spurious findings are excluded, as they
      name no manufacturer.
    columns:
      - name: findings_per_manufacturer
        data_tests: [unique, not_null]
      - name: pct_of_findings
        description: "Share of all attributable findings held by companies at this level."

  - name: mart_lab_vs_maker_state
    description: >
      One row: how often the testing laboratory's state differs from the manufacturer's. The
      states dashboard shows this as a headline figure, computed rather than written into prose so
      it cannot go stale. Only findings where both states are known can answer it, and that
      denominator is a column of its own.
    columns:
      - name: pct_tested_in_a_different_state
        description: "92.7% as of 2026-11-19. Why 'reports by state' is never one chart."
      - name: pct_of_findings_comparable
        description: "Share of the archive where both states are known (75.7%); the rest cannot answer."

  - name: mart_spurious_report
    description: >
      One row per spurious (counterfeit) finding, with batch, product, alert month and CDSCO link.
      Built to be hard to misuse: it carries NO manufacturer_id, so nothing can join these findings
      to a company, and the copied brand is named `name_printed_on_the_pack` rather than anything
      resembling "manufacturer". The company on a fake pack is the victim of the counterfeit
      (CLAUDE.md §6). 77 findings, first seen 2024-04 - a recent, small slice of the archive, and
      not a measure of how much counterfeiting exists.
    columns:
      - name: sample_id
        data_tests: [unique, not_null]
      - name: name_printed_on_the_pack
        description: >
          The brand copied onto the counterfeit. Never to be shown as the manufacturer; filled on
          17 of 77 findings.
      - name: source_url
        data_tests: [not_null]

  - name: mart_data_freshness
    description: >
      One row: when the warehouse was last rebuilt by a run that *passed its checks*, and what that
      run loaded. Reads Phase 5's run log through a dbt source, so the public dashboards can show
      their own freshness without Superset being granted access to the `ops` schema.
      The latest *successful* run, not the latest run: a failed run leaves the previous data in
      place, so its timestamp would overstate freshness.
    columns:
      - name: last_updated_at
        data_tests: [not_null]
      - name: days_since_update
        description: "CDSCO publishes monthly; over ~45 days means the pipeline has stopped."
      - name: quality_gate
        description: "The Great Expectations task's state on that run."

