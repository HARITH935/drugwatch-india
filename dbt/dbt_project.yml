# The dbt project that builds the gold layer (Phase 4). `dbt build` runs every model, then its tests.
name: "drugwatch"
version: "1.0.0"
profile: "drugwatch" # which block of profiles.yml to use for the connection

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"] # what `dbt clean` deletes

vars:
  # How many manufacturers must agree before a PIN prefix is trusted to mean a state.
  # 3, chosen by holdout: 99.78% agreement on held-out rows against 99.59% at 2.
  pin_prefix_min_observations: 3

# Runs before any model, every invocation. The API's fuzzy drug search needs pg_trgm, and the
# extension must exist before a model tries to build an index that uses it (Phase 9 decision B).
on-run-start:
  - "{{ create_extension_pg_trgm() }}"

flags:
  # dbt phones home with anonymous usage statistics unless this is off. A public-interest data
  # project should not send telemetry it never asked its users about.
  send_anonymous_usage_stats: false

# Seeds are small CSV reference tables that dbt loads into the warehouse. The state vocabulary
# lives here rather than in SQL: it is reviewable as a table, diffable in git, and a new spelling
# is a one-line change with no model to re-read.
seeds:
  drugwatch:
    +schema: dbt_seeds

models:
  drugwatch:
    staging:
      # A view, not a table: a staging model is a thin rename-and-cast over the source, so
      # materialising it would store a second copy of silver that can go stale. Views cost
      # nothing to build and are always current.
      +materialized: view
      # Real schema names, not dbt's default prefixing - see macros/generate_schema_name.sql.
      # `dbt_staging`, NOT `staging`: `staging` is the landing schema the loader writes into
      # (staging.silver_nsq), and dbt must never build into the schema it reads from.
      +schema: dbt_staging
    intermediate:
      # Views: intermediate models are build steps on the way to gold, not something anyone
      # queries directly, so there is no reason to store their rows.
      +materialized: view
      +schema: dbt_intermediate
    marts:
      # Tables, not views: gold is what Superset, the API and the ML pipeline read, and they
      # should read stored rows rather than re-run the whole chain of SQL on every page load.
      +materialized: table
      +schema: gold
